<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChatSchool — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --surface-2: #22222c;
      --border: #2e2e3a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --user-bubble: #3b82f6;
      --bot-bubble: #27272a;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(0,0,0,0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 12px rgba(139, 92, 246, 0.4);
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 18px;
    }

    .icon-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Chat area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .user .avatar {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
    }

    .bot .avatar {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }

    .bubble-wrap {
      flex: 1;
      min-width: 0;
    }

    .sender {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding-left: 2px;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: white;
    }

    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .attachment-preview {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      max-width: 220px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .attachment-preview img {
      display: block;
      max-width: 100%;
      max-height: 180px;
      object-fit: cover;
    }

    .file-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface-2);
      border-radius: 10px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      max-width: 260px;
    }

    .file-chip .icon {
      font-size: 20px;
    }

    .file-chip .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .typing span:nth-child(1) { animation-delay: -0.32s; }
    .typing span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      gap: 16px;
    }

    .empty-state .big-icon {
      font-size: 56px;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      color: var(--text);
      font-weight: 600;
    }

    .empty-state p {
      max-width: 360px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      max-width: 520px;
    }

    .suggestion {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion:hover {
      background: var(--border);
      border-color: var(--accent);
    }

    /* Input area */
    .input-area {
      padding: 12px 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-wrapper {
      max-width: 860px;
      margin: 0 auto;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    .pending-files {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 4px 0;
    }

    .pending-item {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .pending-item img {
      display: block;
      width: 72px;
      height: 72px;
      object-fit: cover;
    }

    .pending-file {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
      max-width: 180px;
    }

    .pending-item .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      background: rgba(0,0,0,0.7);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #file-input {
      display: none;
    }

    .attach-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .attach-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      max-height: 140px;
      min-height: 24px;
      padding: 8px 4px;
      line-height: 1.45;
      outline: none;
    }

    #user-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 10px;
      opacity: 0.8;
    }

    /* Scrollbar */
    #chat-container::-webkit-scrollbar {
      width: 6px;
    }
    #chat-container::-webkit-scrollbar-track {
      background: transparent;
    }
    #chat-container::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      header { padding: 12px 14px; }
      #chat-container { padding: 16px 12px; }
      .message { gap: 10px; }
      .bubble { padding: 11px 14px; font-size: 0.92rem; }
      .input-area { padding: 10px 12px 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <div class="logo-icon">🎓</div>
      <div class="logo-text">Chat<span>School</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="clear-btn" title="Clear conversation">🗑️</button>
    </div>
  </header>

  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <div class="big-icon">🎓</div>
      <h2>Welcome to ChatSchool</h2>
      <p>Your friendly AI assistant. Ask anything, share photos or files, and get helpful responses.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Explain quantum computing simply">Explain quantum computing</button>
        <button class="suggestion" data-prompt="Help me brainstorm project ideas">Brainstorm project ideas</button>
        <button class="suggestion" data-prompt="Write a short story about a robot">Write a short story</button>
        <button class="suggestion" data-prompt="What can you do?">What can you do?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <div class="pending-files" id="pending-files"></div>
      <div class="input-row">
        <button class="attach-btn" id="attach-btn" title="Attach file or photo">📎</button>
        <input type="file" id="file-input" multiple accept="image/*,.pdf,.txt,.md,.csv,.json,.js,.html,.css,.py,.doc,.docx" />
        <textarea id="user-input" placeholder="Message ChatSchool..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" disabled title="Send">➤</button>
      </div>
    </div>
    <div class="hint">ChatSchool can make mistakes. Verify important information.</div>
  </div>

  <script>
    // ========== DOM ==========
    const chatContainer = document.getElementById('chat-container');
    const emptyState = document.getElementById('empty-state');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const attachBtn = document.getElementById('attach-btn');
    const fileInput = document.getElementById('file-input');
    const pendingFilesEl = document.getElementById('pending-files');
    const clearBtn = document.getElementById('clear-btn');

    let pendingFiles = [];
    let isGenerating = false;
    let conversationHistory = [];

    // ========== Auto-resize textarea ==========
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
      updateSendState();
    });

    // ========== File handling ==========
    attachBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        if (pendingFiles.length >= 5) return; // limit
        const id = Date.now() + Math.random().toString(36).slice(2);
        const item = { id, file, url: null };

        if (file.type.startsWith('image/')) {
          item.url = URL.createObjectURL(file);
        }
        pendingFiles.push(item);
      });
      renderPendingFiles();
      fileInput.value = '';
      updateSendState();
    });

    function renderPendingFiles() {
      pendingFilesEl.innerHTML = '';
      pendingFiles.forEach(item => {
        const div = document.createElement('div');
        div.className = 'pending-item';

        if (item.url) {
          div.innerHTML = `
            <img src="${item.url}" alt="preview" />
            <button class="remove" data-id="${item.id}">✕</button>
          `;
        } else {
          const ext = item.file.name.split('.').pop()?.toUpperCase() || 'FILE';
          div.innerHTML = `
            <div class="pending-file">
              <span>📄</span>
              <span class="name" title="${item.file.name}">${item.file.name}</span>
            </div>
            <button class="remove" data-id="${item.id}">✕</button>
          `;
        }
        pendingFilesEl.appendChild(div);
      });

      pendingFilesEl.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const found = pendingFiles.find(f => f.id === id);
          if (found?.url) URL.revokeObjectURL(found.url);
          pendingFiles = pendingFiles.filter(f => f.id !== id);
          renderPendingFiles();
          updateSendState();
        });
      });
    }

    // ========== Send state ==========
    function updateSendState() {
      const hasText = userInput.value.trim().length > 0;
      const hasFiles = pendingFiles.length > 0;
      sendBtn.disabled = (!hasText && !hasFiles) || isGenerating;
    }

    // ========== Suggestions ==========
    document.querySelectorAll('.suggestion').forEach(btn => {
      btn.addEventListener('click', () => {
        userInput.value = btn.dataset.prompt;
        userInput.dispatchEvent(new Event('input'));
        userInput.focus();
      });
    });

    // ========== Clear ==========
    clearBtn.addEventListener('click', () => {
      if (conversationHistory.length === 0) return;
      if (confirm('Clear the entire conversation?')) {
        conversationHistory = [];
        chatContainer.innerHTML = '';
        chatContainer.appendChild(emptyState);
        emptyState.style.display = 'flex';
      }
    });

    // ========== Keyboard ==========
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // ========== Core chat ==========
    async function sendMessage() {
      const text = userInput.value.trim();
      if ((!text && pendingFiles.length === 0) || isGenerating) return;

      // Hide empty state
      emptyState.style.display = 'none';

      // Snapshot files
      const filesToSend = [...pendingFiles];
      pendingFiles = [];
      renderPendingFiles();

      // Clear input
      userInput.value = '';
      userInput.style.height = 'auto';
      updateSendState();

      // Add user message
      addMessage('user', text, filesToSend);
      conversationHistory.push({ role: 'user', content: text, files: filesToSend.map(f => f.file.name) });

      // Show typing
      isGenerating = true;
      updateSendState();
      const typingEl = showTyping();

      // Simulate thinking delay
      await sleep(600 + Math.random() * 900);

      // Generate response
      const response = generateResponse(text, filesToSend);
      typingEl.remove();

      addMessage('bot', response);
      conversationHistory.push({ role: 'assistant', content: response });

      isGenerating = false;
      updateSendState();
      userInput.focus();
    }

    function addMessage(role, text, files = []) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;

      const avatar = role === 'user' ? '👤' : '🎓';
      const name = role === 'user' ? 'You' : 'ChatSchool';

      let attachmentsHTML = '';
      if (files.length > 0) {
        attachmentsHTML = '<div class="attachments">';
        files.forEach(f => {
          if (f.url) {
            attachmentsHTML += `
              <div class="attachment-preview">
                <img src="${f.url}" alt="attachment" />
              </div>`;
          } else {
            attachmentsHTML += `
              <div class="file-chip">
                <span class="icon">📄</span>
                <span class="name">${f.file.name}</span>
              </div>`;
          }
        });
        attachmentsHTML += '</div>';
      }

      msg.innerHTML = `
        <div class="avatar">${avatar}</div>
        <div class="bubble-wrap">
          <div class="sender">${name}</div>
          <div class="bubble">${escapeHTML(text) || (files.length ? '' : '...')}${attachmentsHTML}</div>
        </div>
      `;

      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'message bot';
      el.innerHTML = `
        <div class="avatar">🎓</div>
        <div class="bubble-wrap">
          <div class="sender">ChatSchool</div>
          <div class="typing">
            <span></span><span></span><span></span>
          </div>
        </div>
      `;
      chatContainer.appendChild(el);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return el;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // ========== AI Response Engine ==========
    function generateResponse(text, files) {
      const lower = text.toLowerCase().trim();
      const hasImages = files.some(f => f.file.type.startsWith('image/'));
      const hasFiles = files.length > 0;
      const fileNames = files.map(f => f.file.name).join(', ');

      // File-aware responses
      if (hasFiles && !text) {
        if (hasImages) {
          return pick([
            `I can see the image${files.length > 1 ? 's' : ''} you shared! What would you like me to do with ${files.length > 1 ? 'them' : 'it'}? I can describe, analyze, or help you brainstorm ideas based on the visual.`,
            `Nice photo${files.length > 1 ? 's' : ''}! Feel free to ask me anything about ${files.length > 1 ? 'them' : 'it'} — composition, content, ideas, or edits.`,
            `Got the image${files.length > 1 ? 's' : ''}. How can I help you with ${files.length > 1 ? 'these' : 'this'}?`
          ]);
        }
        return `I've received your file${files.length > 1 ? 's' : ''}: **${fileNames}**. What would you like me to do with ${files.length > 1 ? 'them' : 'it'}? I can help summarize, explain, extract insights, or answer questions about the content.`;
      }

      if (hasFiles && text) {
        if (hasImages) {
          return `Looking at the image${files.length > 1 ? 's' : ''} you attached along with your message:\n\n"${text}"\n\n${generateContextualReply(lower)}\n\n(If you'd like a more detailed visual analysis, just let me know!)`
        }
        return `Regarding your file${files.length > 1 ? 's' : ''} (**${fileNames}**) and your question:\n\n${generateContextualReply(lower)}`;
      }

      // Pure text
      return generateContextualReply(lower);
    }

    function generateContextualReply(lower) {
      // Greetings
      if (/^(hi|hello|hey|howdy|good (morning|afternoon|evening)|sup|yo)\b/.test(lower)) {
        return pick([
          "Hey there! 👋 I'm ChatSchool — ready to help with questions, ideas, writing, code, learning, or just chatting. What's on your mind?",
          "Hello! Great to meet you. I can help with almost anything: explanations, creative writing, problem-solving, coding, brainstorming... What would you like to explore?",
          "Hi! Welcome to ChatSchool. Ask me anything — I'm here to assist, teach, and create with you."
        ]);
      }

      // What can you do
      if (/what can you do|your capabilities|what are you|who are you|help me|capabilities/.test(lower)) {
        return `I'm **ChatSchool**, a helpful AI assistant. Here's what I can do:

• **Answer questions** on almost any topic
• **Explain concepts** simply or in depth
• **Write & edit** — stories, emails, essays, code, poems
• **Brainstorm** ideas for projects, names, plots, solutions
• **Help with learning** — study tips, summaries, practice questions
• **Analyze files** you attach (images, documents, code)
• **Creative tasks** — stories, jokes, roleplay, world-building
• **Practical help** — planning, pros/cons, step-by-step guides

Just type a message or attach a photo/file and ask away!`;
      }

      // Thanks
      if (/thank|thanks|thx|appreciate/.test(lower)) {
        return pick([
          "You're welcome! Happy to help. Anything else on your mind?",
          "Anytime! That's what I'm here for. 😊",
          "Glad it was useful! Feel free to ask more."
        ]);
      }

      // Code related
      if (/code|javascript|python|html|css|programming|function|bug|error|script/.test(lower)) {
        return pick([
          "I'd be happy to help with code! You can paste a snippet, describe the problem, or ask me to write something from scratch. What language and what are you trying to achieve?",
          "Coding time! Tell me more about what you're building or stuck on — I can write examples, debug, explain concepts, or refactor.",
          "Sure, let's tackle that programming question. Share the relevant code or describe the goal and any errors you're seeing."
        ]);
      }

      // Creative / story
      if (/story|write|poem|creative|imagine|fiction|novel|character/.test(lower)) {
        return pick([
          "I love creative requests! Here's a quick spark based on what you said — or tell me a genre, tone, or specific idea and I'll expand it into something longer.\n\nOnce upon a time in a quiet corner of the digital world, an idea began to take shape...",
          "Creative mode activated. Give me a few more details (setting, mood, length, characters) and I'll craft something tailored for you.",
          "Writing is one of my favorite things. Want a short story, a poem, a scene, or help developing an idea further?"
        ]);
      }

      // Explain / learn
      if (/explain|what is|how does|teach|learn|define|meaning of/.test(lower)) {
        return pick([
          "Great question! I'll break it down clearly.\n\n" + (lower.length > 20 ? `Regarding "${lower.slice(0, 80)}${lower.length > 80 ? '…' : ''}" — ` : '') + "The core idea is usually simpler than it first appears. Would you like a beginner-friendly explanation, a deeper technical dive, or examples and analogies?",
          "I'd be glad to explain that. To make it most useful: do you want the short version, a detailed breakdown, or real-world examples?",
          "Learning mode on. Tell me how deep you'd like to go and I'll tailor the explanation."
        ]);
      }

      // Ideas / brainstorm
      if (/idea|brainstorm|suggest|recommend|project|inspire/.test(lower)) {
        return pick([
          "Brainstorming is fun! Here are a few directions to get started:\n\n1. Something practical you can build this weekend\n2. A creative or artistic project\n3. A learning challenge\n4. Something that combines two of your interests\n\nWant me to expand on any of these or focus on a specific area?",
          "Let's generate some ideas. To make them better, tell me: what domain (tech, art, business, personal…), any constraints, and whether you want wild ideas or practical ones.",
          "Idea engine ready. Share a theme or problem and I'll throw out a range of possibilities."
        ]);
      }

      // Math / calculate
      if (/calculate|math|solve|equation|percent|%\b|\d+\s*[\+\-\*\/]/.test(lower)) {
        return "I can help with math! For best results, write the problem clearly (or use LaTeX-style notation). I'll walk through the steps so you understand the solution, not just the answer.";
      }

      // Jokes
      if (/joke|funny|make me laugh|humor/.test(lower)) {
        return pick([
          "Why do programmers prefer dark mode?\n\nBecause light attracts bugs. 🐛",
          "I told my computer I needed a break…\n\nIt said \"No problem — I'll go to sleep.\"",
          "Why was the JavaScript developer sad?\n\nBecause he didn't Node how to Express himself."
        ]);
      }

      // Weather / time (can't really know)
      if (/weather|temperature|forecast/.test(lower)) {
        return "I don't have live weather data in this demo version, but I can help you interpret a forecast, suggest what to wear, or plan around typical conditions for a location if you tell me the city!";
      }

      // Default intelligent-ish replies
      const defaults = [
        `Interesting! "${text.slice(0, 60)}${text.length > 60 ? '…' : ''}"\n\nI'd love to dig into this with you. Could you share a bit more context or what specifically you'd like help with?`,
        `Got it. Based on what you said, here are a few ways I can help:\n\n• Explain the topic in simple terms\n• Give a detailed breakdown\n• Suggest next steps or resources\n• Help you create something related\n\nWhich direction sounds useful?`,
        `Thanks for sharing that. I can expand on this, challenge the idea, turn it into a plan, or help you explore related questions. What would be most helpful right now?`,
        `I'm here for it. Whether you want analysis, creativity, structure, or just a sounding board — tell me how deep or practical you'd like the response to be.`,
        `Solid question / request. Let me offer a thoughtful starting point, and we can refine from there.\n\nWhat outcome are you hoping for?`
      ];

      // Slight personalization based on length
      if (lower.length < 12) {
        return pick([
          "Could you tell me a little more? The more detail you give, the better I can help.",
          "I'm listening — expand on that a bit and I'll jump in with something useful."
        ]);
      }

      return pick(defaults);
    }

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // Focus input on load
    userInput.focus();
  </script>
</body>
</html>
